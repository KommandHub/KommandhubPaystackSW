services:
  shopware:
    image: 'dockware/shopware:6.7.8.0'
    container_name: kommandhub-paystack-plugin
    environment:
      - 'XDEBUG_ENABLED=0'
      - 'PHP_VERSION=8.3'
    volumes:
      # ----------------------------------------------------------------------------------------------------------------------------------
      # PLUGINS
      - "./:/var/www/html/custom/static-plugins/KommandhubPaystackSW"
      - "database:/var/lib/mysql"
      - "./Makefile:/var/www/html/Makefile"
      # - ".env.test:/var/www/html/.env.test"
      # ----------------------------------------------------------------------------------------------------------------------------------
      # EXCLUDE
      - "/var/www/html/custom/static-plugins/KommandhubPaystackSW/.git/"
      - "/var/www/html/custom/static-plugins/KommandhubPaystackSW/node_modules/"
      - "/var/www/html/custom/static-plugins/KommandhubPaystackSW/vendor/"
      # ----------------------------------------------------------------------------------------------------------------------------------

volumes:
  database:
    driver: local