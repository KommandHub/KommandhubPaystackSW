services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Kommandhub\PaystackSW\:
    resource: '../../*'
    exclude: '../../{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

  Kommandhub\PaystackSW\Payment\Application\Processor\TransactionVerificationProcessorInterface:
    alias: Kommandhub\PaystackSW\Payment\Application\Processor\TransactionVerificationProcessor

  Kommandhub\PaystackSW\Payment\Application\Processor\TransactionMetadataProcessorInterface:
    alias: Kommandhub\PaystackSW\Payment\Application\Processor\TransactionMetadataProcessor

  Kommandhub\PaystackSW\Payment\Infrastructure\Shopware\Handler\PaystackPaymentHandler:
    tags:
      - { name: 'shopware.payment_handler' }

  Kommandhub\PaystackSW\Administration\Controller\RefundController:
    arguments:
      $paystack: '@Kommandhub\PaystackSW\Payment\Infrastructure\Paystack\Paystack'
    tags:
      - { name: 'container.service', method: 'setContainer' }
    calls:
      - [setContainer, ['@service_container']]
    public: true

  Kommandhub\PaystackSW\Webhook\Presentation\Storefront\Controller\WebhookController:
    public: true
    calls:
      - [ setContainer, [ '@service_container' ] ]
    tags: [ ]